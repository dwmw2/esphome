wifi:
  ssid: MySSID
  password: password1

tuya_tcp:
  - id: tuya_tcp_device
    address: "192.168.1.100"
    device_id: "test_device_id"
    key: "test_local_key"
    version: "3.3"

binary_sensor:
  - platform: tuya
    id: tuya_binary_sensor
    tuya_id: tuya_tcp_device
    sensor_datapoint: 1

climate:
  - platform: tuya
    id: tuya_climate
    tuya_id: tuya_tcp_device
    switch_datapoint: 1
    target_temperature_datapoint: 3
    current_temperature_multiplier: 0.5
    target_temperature_multiplier: 0.5
    reports_fahrenheit: true

cover:
  - platform: tuya
    id: tuya_cover
    tuya_id: tuya_tcp_device
    position_datapoint: 2

light:
  - platform: tuya
    id: tuya_light
    tuya_id: tuya_tcp_device
    switch_datapoint: 1
    dimmer_datapoint: 2
    min_value_datapoint: 3
    color_temperature_datapoint: 4
    min_value: 1
    max_value: 100
    cold_white_color_temperature: 153 mireds
    warm_white_color_temperature: 500 mireds
    gamma_correct: 1

number:
  - platform: tuya
    id: tuya_number
    tuya_id: tuya_tcp_device
    number_datapoint: 102
    min_value: 0
    max_value: 17
    step: 1

select:
  - platform: tuya
    id: tuya_select_enum
    tuya_id: tuya_tcp_device
    enum_datapoint: 42
    options:
      0: Internal
      1: Floor
      2: Both
  - platform: tuya
    id: tuya_select_int
    tuya_id: tuya_tcp_device
    int_datapoint: 43
    options:
      0: Internal
      1: Floor
      2: Both
  - platform: tuya
    id: tuya_select_string
    tuya_id: tuya_tcp_device
    string_datapoint: 44
    options:
      - "auto"
      - "manual"
      - "eco"

sensor:
  - platform: tuya
    id: tuya_sensor
    tuya_id: tuya_tcp_device
    sensor_datapoint: 1

switch:
  - platform: tuya
    id: tuya_switch
    tuya_id: tuya_tcp_device
    switch_datapoint: 1
